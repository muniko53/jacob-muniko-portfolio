<script>
  // Dark is the default. A saved choice wins. Inline so there is no flash.
  try {
    var stored = localStorage.getItem("jm-theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {}
</script>
