<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="fp-title fp-desc">
  <title id="fp-title">FilePilot architecture</title>
  <desc id="fp-desc">A PySide6 desktop interface runs slow work on TaskThread workers. Core services cover scanning, SQLite storage, a safety layer, an audited deletion pipeline, duplicate verification, Smart Clean, the organiser, Defender reporting, Explorer diagnostics and recovery. Windows shell calls remain behind the safety layer and are still beta-tested.</desc>
  <rect width="1200" height="700" fill="#101513"/>
  <g font-family="IBM Plex Sans, Segoe UI, sans-serif" fill="#EDEFEA">
    <text x="48" y="54" font-size="15" font-weight="600" letter-spacing="2.4" fill="#56C7B2">FILEPILOT / DESKTOP ARCHITECTURE</text>
    <text x="48" y="88" font-size="13" fill="#9AA59E">PySide6 · SQLite · Windows file intelligence · v0.20.0 beta</text>
    <line x1="48" y1="108" x2="1152" y2="108" stroke="#2B3531"/>

    <!-- UI -->
    <rect x="48" y="146" width="300" height="206" rx="4" fill="#17201C" stroke="#56C7B2"/>
    <text x="68" y="176" font-size="15" font-weight="600">PySide6 interface</text>
    <text x="68" y="200" font-size="11" fill="#9AA59E">Overview · Storage · Analytics · Search</text>
    <text x="68" y="220" font-size="11" fill="#9AA59E">Duplicates · Smart Clean · Organiser</text>
    <text x="68" y="240" font-size="11" fill="#9AA59E">Diagnostics · Security · Recovery · Backup</text>
    <text x="68" y="260" font-size="11" fill="#9AA59E">Activity · Settings · Simple / Advanced</text>
    <text x="68" y="296" font-size="10" font-family="IBM Plex Mono, Consolas, monospace" fill="#56C7B2">LIGHT · DARK · KISWAHILI CATALOGUE</text>
    <text x="68" y="322" font-size="11" fill="#9AA59E">No telemetry. No accounts. No network calls.</text>

    <!-- workers -->
    <rect x="398" y="146" width="190" height="206" rx="4" fill="#17201C" stroke="#3A4A43"/>
    <text x="418" y="176" font-size="14" font-weight="600">TaskThread</text>
    <text x="418" y="200" font-size="11" fill="#9AA59E">Progress · cancel · fail</text>
    <text x="418" y="220" font-size="11" fill="#9AA59E">signals</text>
    <text x="418" y="248" font-size="11" fill="#9AA59E">Scan · operations</text>
    <text x="418" y="268" font-size="11" fill="#9AA59E">diagnostics · security</text>
    <text x="418" y="304" font-size="10" font-family="IBM Plex Mono, Consolas, monospace" fill="#56C7B2">GUI NEVER BLOCKS</text>
    <text x="418" y="330" font-size="11" fill="#9AA59E">Worst measured stall: 74 ms</text>

    <!-- core -->
    <rect x="638" y="146" width="514" height="206" rx="4" fill="#17201C" stroke="#3A4A43"/>
    <text x="658" y="176" font-size="14" font-weight="600">Core services · no Qt</text>

    <rect x="658" y="196" width="150" height="58" rx="3" fill="#101513" stroke="#3A4A43"/>
    <text x="672" y="219" font-size="11" font-weight="600">Scanner</text>
    <text x="672" y="238" font-size="10" fill="#9AA59E">os.scandir · batched</text>

    <rect x="822" y="196" width="150" height="58" rx="3" fill="#101513" stroke="#3A4A43"/>
    <text x="836" y="219" font-size="11" font-weight="600">SQLite</text>
    <text x="836" y="238" font-size="10" fill="#9AA59E">WAL · migrations</text>

    <rect x="986" y="196" width="146" height="58" rx="3" fill="#101513" stroke="#D8A25C"/>
    <text x="1000" y="219" font-size="11" font-weight="600" fill="#D8A25C">Safety layer</text>
    <text x="1000" y="238" font-size="10" fill="#9AA59E">containment · identity</text>

    <rect x="658" y="268" width="150" height="58" rx="3" fill="#101513" stroke="#3A4A43"/>
    <text x="672" y="291" font-size="11" font-weight="600">Duplicates</text>
    <text x="672" y="310" font-size="10" fill="#9AA59E">SHA-256 · re-check</text>

    <rect x="822" y="268" width="150" height="58" rx="3" fill="#101513" stroke="#3A4A43"/>
    <text x="836" y="291" font-size="11" font-weight="600">Smart Clean</text>
    <text x="836" y="310" font-size="10" fill="#9AA59E">allow-list only</text>

    <rect x="986" y="268" width="146" height="58" rx="3" fill="#101513" stroke="#3A4A43"/>
    <text x="1000" y="291" font-size="11" font-weight="600">Organiser</text>
    <text x="1000" y="310" font-size="10" fill="#9AA59E">preview · no overwrite</text>

    <!-- pipeline -->
    <rect x="48" y="392" width="1104" height="86" rx="4" fill="#17201C" stroke="#D8A25C"/>
    <text x="68" y="420" font-size="11" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1.4" fill="#D8A25C">DESTRUCTIVE OPERATION CONTRACT</text>
    <text x="68" y="446" font-size="12" fill="#EDEFEA">Read-only plan → review dialog → approval bound to that plan → per-item identity revalidation → Recycle Bin by default → audited result</text>
    <text x="68" y="466" font-size="11" fill="#9AA59E">A failed recycle is never retried as a permanent delete. Changed items are skipped, not forced.</text>

    <!-- windows -->
    <rect x="48" y="512" width="1104" height="92" rx="4" fill="#17201C" stroke="#3A4A43"/>
    <text x="68" y="540" font-size="12" font-weight="600">Windows surface</text>
    <text x="68" y="563" font-size="11" fill="#9AA59E">Recycle Bin · Microsoft Defender · Restart Manager · Explorer diagnostics · File Recovery command builder · backup evidence</text>
    <text x="68" y="584" font-size="10" font-family="IBM Plex Mono, Consolas, monospace" fill="#D8A25C">BETA: WINDOWS-SPECIFIC PATHS ARE TESTED WITH DOUBLES, NOT YET ON REAL WINDOWS</text>

    <text x="48" y="646" font-size="11" fill="#9AA59E">491 automated tests · mutation-checked safety rules · installer not yet published</text>
    <text x="48" y="668" font-size="11" fill="#6F7A73">Verified against FilePilot v0.20.0 README, ARCHITECTURE, SAFETY and AUDIT_0.20.0</text>
  </g>
</svg>
